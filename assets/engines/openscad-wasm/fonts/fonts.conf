<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Configuración de fontconfig del motor integrado de ScadLab: solo las
     fuentes embebidas (Liberation Sans) y una caché en memoria. Sin este
     archivo, fontconfig imprime avisos de «no hay configuración» y «no hay
     directorio de caché escribible» en cada ejecución. -->
<fontconfig>
  <dir>/fonts</dir>
  <cachedir>/cache/fontconfig</cachedir>
</fontconfig>
